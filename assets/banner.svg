<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="glowPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.04); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(12px) scale(0.96); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.8; stroke-dashoffset: 40; }
      }
      @keyframes glowOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(-10px, -8px); opacity: 0.65; }
      }
      @keyframes waveScan {
        0% { transform: translateX(-400px); opacity: 0; }
        40% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      @keyframes nodeBlink {
        0%, 100% { r: 3.5; opacity: 0.6; }
        50% { r: 5.5; opacity: 1; }
      }

      .floating-orb-1 { animation: glowOrb 8s ease-in-out infinite alternate; }
      .floating-orb-2 { animation: glowOrb 10s ease-in-out infinite alternate-reverse; }
      .anim-beam-1 { animation: pulseBeam 4s ease-in-out infinite; stroke-dasharray: 8 6; }
      .anim-beam-2 { animation: pulseBeam 5s ease-in-out infinite reverse; stroke-dasharray: 6 8; }
      .scan-line { animation: waveScan 7s linear infinite; }
      .node-p1 { animation: nodeBlink 3s ease-in-out infinite; }
      .node-p2 { animation: nodeBlink 3.8s ease-in-out infinite 0.7s; }
      .node-p3 { animation: nodeBlink 4.2s ease-in-out infinite 1.4s; }
      .node-p4 { animation: nodeBlink 3.2s ease-in-out infinite 2.1s; }
      .vector-group { animation: floatSlow 6s ease-in-out infinite; }
      .graph-group { animation: floatReverse 7s ease-in-out infinite; }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.6px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="340" fill="url(#bgGradient)"/>

  <!-- Subtle Tech Grid Background -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="250" y1="0" x2="250" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
    <line x1="650" y1="0" x2="650" y2="340"/>
    <line x1="850" y1="0" x2="850" y2="340"/>
    <line x1="1050" y1="0" x2="1050" y2="340"/>
  </g>

  <!-- Ambient Blurred Orbs (Deep Layer) -->
  <circle class="floating-orb-1" cx="200" cy="100" r="140" fill="url(#glowPoint)" filter="url(#blurFilter)"/>
  <circle class="floating-orb-2" cx="1020" cy="220" r="160" fill="url(#purpleGlow)" filter="url(#blurFilter)"/>
  <circle cx="600" cy="300" r="100" fill="url(#cyanPurpleGrad)" opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Scanning Wave Beam in Background -->
  <g class="scan-line" opacity="0.4">
    <line x1="0" y1="0" x2="200" y2="340" stroke="url(#titleGrad)" stroke-width="2" filter="url(#softGlow)"/>
  </g>

  <!-- Dynamic Vector Graph & Semantic Network (Left/Right Background/Midground Accent) -->
  <g class="vector-group" opacity="0.55">
    <!-- Left Neural Cluster -->
    <line x1="80" y1="180" x2="150" y2="120" stroke="#38bdf8" stroke-width="1.2" class="anim-beam-1"/>
    <line x1="150" y1="120" x2="230" y2="170" stroke="#818cf8" stroke-width="1.2" class="anim-beam-2"/>
    <line x1="150" y1="120" x2="180" y2="60" stroke="#c084fc" stroke-width="1.2" class="anim-beam-1"/>
    <line x1="80" y1="180" x2="140" y2="240" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="140" y1="240" x2="230" y2="170" stroke="#818cf8" stroke-width="1.2"/>

    <circle class="node-p1" cx="80" cy="180" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle class="node-p2" cx="150" cy="120" r="4.5" fill="#818cf8" filter="url(#softGlow)"/>
    <circle class="node-p3" cx="230" cy="170" r="4" fill="#c084fc" filter="url(#softGlow)"/>
    <circle class="node-p4" cx="180" cy="60" r="3.5" fill="#38bdf8"/>
    <circle class="node-p2" cx="140" cy="240" r="3.5" fill="#818cf8"/>
  </g>

  <g class="graph-group" opacity="0.55">
    <!-- Right High-Dimensional Vector / RAG Embedding Lines -->
    <line x1="960" y1="110" x2="1050" y2="80" stroke="#c084fc" stroke-width="1.2" class="anim-beam-1"/>
    <line x1="1050" y1="80" x2="1120" y2="150" stroke="#f472b6" stroke-width="1.2" class="anim-beam-2"/>
    <line x1="1050" y1="80" x2="1020" y2="210" stroke="#818cf8" stroke-width="1.2"/>
    <line x1="1020" y1="210" x2="1110" y2="250" stroke="#38bdf8" stroke-width="1.2" class="anim-beam-1"/>
    <line x1="1120" y1="150" x2="1110" y2="250" stroke="#f472b6" stroke-width="1.2"/>

    <circle class="node-p3" cx="960" cy="110" r="3.5" fill="#818cf8"/>
    <circle class="node-p1" cx="1050" cy="80" r="4.5" fill="#c084fc" filter="url(#softGlow)"/>
    <circle class="node-p4" cx="1120" cy="150" r="4" fill="#f472b6" filter="url(#softGlow)"/>
    <circle class="node-p2" cx="1020" cy="210" r="4" fill="#38bdf8"/>
    <circle class="node-p3" cx="1110" cy="250" r="4.5" fill="#c084fc"/>
  </g>

  <!-- FOREGROUND CONTENT: Header Pill, Title, Subtitle, Tech Tags -->
  <!-- Top Category Pill Badge -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="-118" cy="0" r="4" fill="#22c55e" filter="url(#softGlow)"/>
    <text text-anchor="middle" y="4" fill="#93c5fd" class="badge-text">NEURAL RETRIEVAL &amp; VECTOR SEARCH</text>
  </g>

  <!-- Main Title (Strictly foreground, guaranteed high legibility) -->
  <!-- Subtle dark backing glow for guaranteed legibility across any screen -->
  <text x="600" y="132" text-anchor="middle" fill="#030712" font-size="44" class="title-text" opacity="0.6" dy="2">Awesome NLP &amp; Semantic Search</text>
  <text x="600" y="130" text-anchor="middle" fill="url(#titleGrad)" font-size="44" class="title-text" filter="url(#softGlow)">Awesome NLP &amp; Semantic Search</text>

  <!-- Subtitle (Clear, readable, positioned cleanly below title) -->
  <text x="600" y="176" text-anchor="middle" fill="#e2e8f0" font-size="17" class="subtitle-text">
    Curated Hub of Vector Databases, Hybrid Retrieval, Dense Embeddings &amp; Composable RAG Frameworks
  </text>

  <!-- Feature Pill Tags in Lower Foreground -->
  <g transform="translate(600, 230)">
    <!-- Pill 1: Hybrid BM25 + Dense -->
    <g transform="translate(-390, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-opacity="0.4"/>
      <text text-anchor="middle" y="4.5" fill="#38bdf8" class="badge-text">⚡ HYBRID SEARCH</text>
    </g>
    <!-- Pill 2: Vector Databases -->
    <g transform="translate(-230, 0)">
      <rect x="-75" y="-13" width="150" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-opacity="0.4"/>
      <text text-anchor="middle" y="4.5" fill="#818cf8" class="badge-text">🗄️ VECTOR DATABASES</text>
    </g>
    <!-- Pill 3: RAG Pipelines -->
    <g transform="translate(-70, 0)">
      <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-opacity="0.4"/>
      <text text-anchor="middle" y="4.5" fill="#c084fc" class="badge-text">🧩 RAG PIPELINES</text>
    </g>
    <!-- Pill 4: Neural Embeddings -->
    <g transform="translate(90, 0)">
      <rect x="-75" y="-13" width="150" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-opacity="0.4"/>
      <text text-anchor="middle" y="4.5" fill="#f472b6" class="badge-text">🧠 EMBEDDINGS &amp; NLP</text>
    </g>
    <!-- Pill 5: Cross-Encoder Rerank -->
    <g transform="translate(255, 0)">
      <rect x="-75" y="-13" width="150" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-opacity="0.4"/>
      <text text-anchor="middle" y="4.5" fill="#34d399" class="badge-text">🎯 RERANKING ENGINES</text>
    </g>
    <!-- Pill 6: Open Source & SaaS -->
    <g transform="translate(405, 0)">
      <rect x="-60" y="-13" width="120" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-opacity="0.4"/>
      <text text-anchor="middle" y="4.5" fill="#facc15" class="badge-text">🌐 OSS &amp; SAAS</text>
    </g>
  </g>

  <!-- Subtle Bottom Border Indicator -->
  <line x1="300" y1="290" x2="900" y2="290" stroke="url(#lineGrad)" stroke-width="1.5"/>
</svg>
